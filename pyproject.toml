[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmotogp"
version = "0.1.0"
description = "A clean Python SDK and live telemetry parser for MotoGP data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pandas>=3.0.0",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
live = [
    "websockets>=13.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
analysis = [
    "pdfplumber>=0.11.0",
    "matplotlib>=3.9.0",
    "plotly>=5.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openmotogp"]